<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Board v0.9 (beta)</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #111820;
    --text: #f4f6f8;
    --muted: #8a97a6;
    --line: #223040;
    --on: #1fbf5a;
    --on-text: #06240f;
    --off: #2a3542;
    --off-text: #b7c2cf;
    --key-off: #d92b2b;
    --key-off-text: #ffffff;
    --clock: #ffffff;
    --warn: #f59e0b;
    --accent: #3b82f6;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f3f5f8;
    --text: #0b0f14;
    --muted: #5b6673;
    --line: #d6dde6;
    --on: #16a34a;
    --on-text: #ffffff;
    --off: #e2e8f0;
    --off-text: #475569;
    --key-off: #dc2626;
    --key-off-text: #ffffff;
    --clock: #0b0f14;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- TOP: message area ---------- */
  #top {
    height: 32%;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-bottom: 2px solid var(--line);
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  #toolbar .spacer { flex: 1; }
  #toolbar button, #toolbar select {
    background: var(--off);
    color: var(--off-text);
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  #toolbar button:hover { filter: brightness(1.15); }
  #toolbar button:disabled { opacity: .4; cursor: default; filter: none; }
  #toolbar .label { color: var(--muted); font-size: 13px; margin-left: 4px; }
  #logo { height: 30px; width: auto; margin-right: 6px; }
  #dept { font-weight: 700; font-size: 15px; }
  #dept:empty, #dept:empty + .sep { display: none; }
  .sep { color: var(--muted); margin: 0 4px; }
  #fontSize { min-width: 3.5em; text-align: center; color: var(--text); font-size: 14px; }
  #message {
    flex: 1;
    padding: 12px 20px;
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.25;
    user-select: text;
    font-size: 48px;
  }
  #message:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
  }

  /* ---------- divider ---------- */
  #divider {
    height: 8px;
    cursor: row-resize;
    background: var(--bg);
    position: relative;
  }
  #divider::after {
    content: "";
    position: absolute;
    left: 50%; top: 2px;
    width: 60px; height: 4px;
    margin-left: -30px;
    border-radius: 2px;
    background: var(--line);
  }

  /* ---------- BOTTOM ---------- */
  #bottom {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #clockPane {
    width: 75%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
  }
  #clock {
    color: var(--clock);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1;
    white-space: nowrap;
  }
  #ampm {
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-top: 1vh;
    white-space: nowrap;
    line-height: 1;
  }
  #date {
    color: var(--muted);
    font-weight: 500;
    margin-top: 1vh;
    white-space: nowrap;
  }

  #keysPane {
    width: 25%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    border-left: 2px solid var(--line);
  }
  .key {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    background: var(--key-off);
    color: var(--key-off-text);
    font-family: inherit;
    transition: background .15s, color .15s, transform .05s;
    padding: 8px;
    min-height: 0;
    overflow: hidden;
  }
  .key:active { transform: scale(0.98); }
  .key.on { background: var(--on); color: var(--on-text); }
  .key .name {
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
    font-size: clamp(16px, 2.6vw, 48px);
  }
  .key .sub {
    font-weight: 500;
    text-align: center;
    line-height: 1.15;
    font-size: clamp(12px, 1.5vw, 28px);
    opacity: .9;
    margin-top: -1vh;
  }
  .key .sub:empty { display: none; }
  .key .state {
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: clamp(16px, 3vw, 60px);
    line-height: 1;
    text-align: center;
  }

  /* ---------- settings popup ---------- */
  #settings {
    position: fixed;
    top: 54px; right: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
    min-width: 300px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    font-size: 14px;
  }
  #settings.open { display: flex; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #settings input[type=text] { width: 120px; font-family: inherit; font-size: 13px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #srvStatus { color: var(--muted); font-size: 13px; max-width: 30vw; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #srvStatus.warn { color: var(--warn); font-weight: 600; }
  #srvStatus:empty { display: none; }
  #message.remote { cursor: default; }
  #message p { margin: 0 0 .5em; }
  #message ul, #message ol { margin: .2em 0 .5em; padding-left: 1.3em; }
  #message .katex-display { margin: .3em 0 .5em; }
  #message img.figure { display: block; margin: .3em auto; max-width: 100%; max-height: var(--fig-max, 40vh); object-fit: contain; }
  :root:not([data-theme="light"]) #message img.figure { background: #fff; border-radius: 6px; padding: 4px; }
  #settings .wide { flex-direction: column; align-items: stretch; gap: 4px; }
  #settings .wide input[type=text] { width: 100%; }
  #settings select { font-family: inherit; font-size: 13px; padding: 3px 6px; border-radius: 5px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #settings h4 { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>

<div id="top">
  <div id="toolbar">
    <img id="logo" alt="" src="logo.png" onerror="this.style.display='none'">
    <span id="dept">Cheriton School of Computer Science</span>
    <span class="sep">|</span>
    <button id="fontDown" title="Smaller text (Ctrl + −)">A−</button>
    <span id="fontSize">48</span>
    <button id="fontUp" title="Larger text (Ctrl + +)">A+</button>
    <button id="clearBtn" title="Clear message">Clear</button>
    <button id="undoBtn" title="Undo (Ctrl + Z)" disabled>Undo</button>
    <span class="label">Keys: press 1 / 2 &nbsp;·&nbsp; F11 = full screen</span>
    <span class="spacer"></span>
    <span id="srvStatus"></span>
    <button id="themeBtn" title="Switch light / dark">Theme</button>
    <button id="fullBtn" title="Full screen (F11)">Full screen</button>
    <button id="settingsBtn" title="Settings">⚙</button>
  </div>
  <div id="message" contenteditable="true" spellcheck="false"
       data-placeholder="Type announcements here… (e.g. Phones off. Raise your hand for a question.)"></div>
</div>

<div id="divider" title="Drag to resize"></div>

<div id="bottom">
  <div id="clockPane">
    <div id="clock">00:00:00</div>
    <div id="ampm"></div>
    <div id="date"></div>
  </div>
  <div id="keysPane">
    <button class="key" data-key="1"><span class="name">Washroom</span><span class="sub"></span><span class="state">Not allowed</span></button>
    <button class="key" data-key="2"><span class="name">Hand-in paper</span><span class="sub"></span><span class="state">Not allowed</span></button>
    <!-- <button class="key" data-key="3"><span class="name">Signature time</span><span class="state">OFF</span></button> -->
  </div>
</div>

<div id="settings">
  <h4>Announcements from a server</h4>
  <label class="wide">
    <span style="color:var(--muted)">Control file address (blank = local)</span>
    <input type="text" id="optUrl" placeholder="https://.../examboard/exam.txt" spellcheck="false">
  </label>
  <label>Show <select id="optBlock">
    <option value="announcement">Announcements</option>
    <option value="instructions">Instructions</option>
  </select></label>
  <h4>Header</h4>
  <label>Department <input type="text" id="optDept"></label>
  <h4>Clock</h4>
  <label>24-hour <input type="checkbox" id="opt24"></label>
  <label>Show seconds <input type="checkbox" id="optSec" checked></label>
  <label>Show date <input type="checkbox" id="optDate" checked></label>
  <h4>Key labels &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0">(use \\ for a second line)</span></h4>
  <label>Key 1 <input type="text" id="lbl1"></label>
  <label>Key 2 <input type="text" id="lbl2"></label>
  <!-- <label>Key 3 <input type="text" id="lbl3"></label> -->
  <label>Reset keys to OFF on start <input type="checkbox" id="optResetKeys" checked></label>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- message area, font size, undo ----------
  const msg = $('#message'), undoBtn = $('#undoBtn');
  let fontSize = store.get('fontSize', 48);
  function applyFont() {
    fontSize = Math.max(12, Math.min(300, fontSize));
    msg.style.fontSize = fontSize + 'px';
    $('#fontSize').textContent = fontSize;
    store.set('fontSize', fontSize);
  }
  function stepFont(d) { fontSize += d * (fontSize >= 60 ? 8 : 4); applyFont(); }
  $('#fontUp').onclick = () => stepFont(1);
  $('#fontDown').onclick = () => stepFont(-1);

  // Undo history: snapshot of the text before each change (typing is grouped by pauses)
  const history = [];
  let lastSnapshot = store.get('message', '');
  let typingTimer = null;
  function pushHistory() {
    if (history[history.length - 1] === lastSnapshot) return;
    history.push(lastSnapshot);
    if (history.length > 200) history.shift();
    undoBtn.disabled = false;
  }
  function commit() { lastSnapshot = msg.textContent; store.set('message', lastSnapshot); }
  function undo() {
    if (!history.length) return;
    clearTimeout(typingTimer);
    msg.textContent = history.pop();
    commit();
    undoBtn.disabled = history.length === 0;
    msg.focus();
    // put the caret at the end
    const r = document.createRange(); r.selectNodeContents(msg); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  if (!store.get('srvUrl', '')) msg.textContent = lastSnapshot;
  msg.addEventListener('input', () => {
    if (!typingTimer) pushHistory();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { typingTimer = null; commit(); }, 700);
    store.set('message', msg.textContent);
  });
  msg.addEventListener('blur', () => { if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; commit(); } });
  $('#clearBtn').onclick = () => {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; commit(); }
    if (msg.textContent === '') return;
    pushHistory();
    msg.textContent = '';
    commit();
    msg.focus();
  };
  undoBtn.onclick = undo;
  // paste as plain text only
  msg.addEventListener('paste', (e) => {
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
  });
  applyFont();

  // ---------- keep the screen awake ----------
  // Asks the browser to stop the display from dimming or sleeping while this
  // tab is visible (Screen Wake Lock API: Edge, Chrome, Firefox 126+). The
  // lock is released when the tab is hidden, so it is re-requested on return.
  let wakeLock = null;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();

  // ---------- theme ----------
  const root = document.documentElement;
  root.dataset.theme = store.get('theme', 'dark');
  $('#themeBtn').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    store.set('theme', root.dataset.theme);
  };

  // ---------- full screen ----------
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  $('#fullBtn').onclick = toggleFull;

  // ---------- settings ----------
  const settings = $('#settings');
  $('#settingsBtn').onclick = (e) => { e.stopPropagation(); settings.classList.toggle('open'); };
  document.addEventListener('click', (e) => { if (!settings.contains(e.target)) settings.classList.remove('open'); });
  const opts = {
    h24: store.get('h24', false),
    sec: store.get('sec', true),
    date: store.get('date', true),
    resetKeys: store.get('resetKeys', true),
    // "\\" in a label starts a smaller second line
    labels: store.get('labels2', ['Washroom\\\\(need to wait for a Proctor):', 'Hand-in paper:', 'Signature time:'])
  };
  $('#opt24').checked = opts.h24;
  $('#optSec').checked = opts.sec;
  $('#optDate').checked = opts.date;
  $('#optResetKeys').checked = opts.resetKeys;
  $('#opt24').onchange = (e) => { opts.h24 = e.target.checked; store.set('h24', opts.h24); tick(); fitClock(); };
  $('#optSec').onchange = (e) => { opts.sec = e.target.checked; store.set('sec', opts.sec); tick(); fitClock(); };
  $('#optDate').onchange = (e) => { opts.date = e.target.checked; store.set('date', opts.date); tick(); fitClock(); };
  $('#optResetKeys').onchange = (e) => { opts.resetKeys = e.target.checked; store.set('resetKeys', opts.resetKeys); };
  const dept = store.get('dept', 'Cheriton School of Computer Science');
  $('#dept').textContent = dept; $('#optDept').value = dept;
  $('#optDept').oninput = (e) => { $('#dept').textContent = e.target.value.trim(); store.set('dept', e.target.value.trim()); };

  // ---------- keys ----------
  const keys = Array.from(document.querySelectorAll('.key'));
  const savedStates = opts.resetKeys ? [false, false, false] : store.get('keyStates', [false, false, false]);
  function applyLabel(k, text) {
    const parts = text.split('\\\\');
    k.querySelector('.name').textContent = parts[0].trim();
    k.querySelector('.sub').textContent = parts.slice(1).join(' ').trim();
  }
  keys.forEach((k, i) => {
    applyLabel(k, opts.labels[i]);
    setKey(i, !!savedStates[i]);
    k.onclick = () => { setKey(i, !k.classList.contains('on')); k.blur(); };
    const lbl = $('#lbl' + (i + 1));
    if (!lbl) return;
    lbl.value = opts.labels[i];
    lbl.oninput = (e) => {
      opts.labels[i] = e.target.value || ('Key ' + (i + 1));
      applyLabel(k, opts.labels[i]);
      store.set('labels2', opts.labels);
    };
  });
  function setKey(i, on) {
    keys[i].classList.toggle('on', on);
    keys[i].querySelector('.state').textContent = on ? 'Allowed' : 'Not allowed';
    store.set('keyStates', keys.map(k => k.classList.contains('on')));
  }

  // ---------- keyboard shortcuts ----------
  document.addEventListener('keydown', (e) => {
    const typing = document.activeElement === msg || document.activeElement.tagName === 'INPUT';
    if (e.ctrlKey && (e.key === '=' || e.key === '+')) { e.preventDefault(); stepFont(1); return; }
    if (e.ctrlKey && e.key === '-') { e.preventDefault(); stepFont(-1); return; }
    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z') && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); undo(); return; }
    if (typing) { if (e.key === 'Escape') msg.blur(); return; }
    if (/^[1-9]$/.test(e.key) && keys[+e.key - 1]) { const i = +e.key - 1; setKey(i, !keys[i].classList.contains('on')); }
    if (e.key === 'f' || e.key === 'F') toggleFull();
    if (e.key === 'Escape') settings.classList.remove('open');
  });


  // ================= announcements from a server (optional) =================
  // When a control file address is set in the gear menu, the message area shows
  // the chosen block of that file instead of what was typed here, re-read every
  // five seconds. The clock, the keys and every label stay local to this room.
  // With no address, nothing below runs and the page is entirely stand-alone.
  const srvEl = $('#srvStatus'), urlIn = $('#optUrl'), blockIn = $('#optBlock');
  let srvUrl = store.get('srvUrl', ''), srvBlock = store.get('srvBlock', 'announcement');
  let srvTimer = null, srvLastText = null, srvShown = null, katexState = 0;   // 0 none, 1 loading, 2 ready

  function baseOf(u) { return u.replace(/[?#].*$/, '').replace(/[^\/]*$/, ''); }

  function loadKatex(base) {
    if (katexState) return;
    katexState = 1;
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = base + 'katex/katex.min.css';
    document.head.appendChild(css);
    const a = document.createElement('script');
    a.src = base + 'katex/katex.min.js';
    a.onload = () => {
      const b = document.createElement('script');
      b.src = base + 'katex/auto-render.min.js';
      b.onload = () => { katexState = 2; srvShown = null; showRemote(); };
      b.onerror = () => { katexState = 0; };
      document.head.appendChild(b);
    };
    a.onerror = () => { katexState = 0; };   // no KaTeX: the text still shows, unrendered
    document.head.appendChild(a);
  }

  // "key: value" lines, then the two LaTeX blocks
  function parseControl(text) {
    const cfg = { announcement: '', instructions: '' };
    let block = null;
    for (const line of text.replace(/\r/g, '').split('\n')) {
      const h = line.match(/^\s*(instructions|announcement)\s*:\s*$/i);
      if (h) { block = h[1].toLowerCase(); continue; }
      if (block) { cfg[block] += line + '\n'; continue; }
      if (/^\s*#/.test(line) || /^\s*$/.test(line)) continue;
      const m = line.match(/^\s*([A-Za-z][\w-]*)\s*:\s*(.*)$/);
      if (m) cfg[m[1].toLowerCase()] = m[2].trim();
    }
    return cfg;
  }

  function escapeHtml(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function latexToHtml(src, base) {
    const keep = [];
    let t = src.replace(/\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\\\([\s\S]*?\\\)|\$[^$\n]+?\$/g,
                        m => { keep.push(m); return '\u0000' + (keep.length - 1) + '\u0000'; });
    t = t.replace(/\\includegraphics(?:\[([^\]]*)\])?\{([^{}]*)\}/g, (m, opts, file) => {
      file = file.trim();
      if (!/^[\w.-]+(?:\/[\w.-]+)*\.(png|jpe?g|gif|svg|webp)$/i.test(file) || file.includes('..'))
        return '[image: ' + file + ']';
      let w = '';
      const pm = /width\s*=\s*([\d.]+)\s*(%|\\(?:text|line)width)?/.exec(opts || '');
      if (pm) { const v = parseFloat(pm[1]); w = ' style="width:' + (pm[2] === '%' ? v : v * 100) + '%"'; }
      keep.push('<img class="figure" src="' + base + file + '" alt=""' + w + '>');
      return '\u0000' + (keep.length - 1) + '\u0000';
    });
    t = escapeHtml(t);
    t = t.replace(/(^|[^\\])%.*$/gm, '$1').replace(/\\%/g, '%');
    t = t.replace(/\\begin\{itemize\}/g, '<ul>').replace(/\\end\{itemize\}/g, '</ul>');
    t = t.replace(/\\begin\{enumerate\}/g, '<ol>').replace(/\\end\{enumerate\}/g, '</ol>');
    t = t.replace(/\\item\s*/g, '<li>');
    t = t.replace(/\\textbf\{([^{}]*)\}/g, '<b>$1</b>');
    t = t.replace(/\\emph\{([^{}]*)\}/g, '<i>$1</i>');
    t = t.replace(/\\textit\{([^{}]*)\}/g, '<i>$1</i>');
    t = t.replace(/\\underline\{([^{}]*)\}/g, '<u>$1</u>');
    t = t.replace(/\\section\*?\{([^{}]*)\}/g, '<b>$1</b><br>');
    t = t.replace(/\\\\/g, '<br>').replace(/\\noindent|\\par\b/g, '');
    t = t.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
         .map(x => '<p>' + x.replace(/\n/g, ' ') + '</p>').join('');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
  }

  // The panel cannot be scrolled on a projector, so the typed size acts as a
  // maximum and the text shrinks until all of it fits.
  function fitRemote() {
    if (!srvUrl) return;
    let fig = Math.max(70, msg.clientHeight * 0.58);
    msg.style.setProperty('--fig-max', fig + 'px');
    let size = fontSize;
    msg.style.fontSize = size + 'px';
    const over = () => msg.scrollHeight > msg.clientHeight + 1;
    for (let i = 0; i < 40 && over() && size > 15; i++) {
      size = Math.max(15, size * 0.92);
      msg.style.fontSize = size + 'px';
    }
    // text has a floor below which nobody can read it; a picture does not
    for (let i = 0; i < 25 && over() && fig > 50; i++) {
      fig = Math.max(50, fig * 0.88);
      msg.style.setProperty('--fig-max', fig + 'px');
    }
  }

  function showRemote() {
    if (srvLastText === null) return;
    const cfg = parseControl(srvLastText);
    const text = (cfg[srvBlock] || '').trim();
    if (text === srvShown) return;
    srvShown = text;
    msg.innerHTML = text ? latexToHtml(text, baseOf(srvUrl))
                         : '<span style="color:var(--muted)">No ' + srvBlock + ' in the file.</span>';
    if (katexState === 2 && window.renderMathInElement) {
      try {
        renderMathInElement(msg, { delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
          { left: '$', right: '$', display: false } ], throwOnError: false });
      } catch (e) {}
    }
    fitRemote();
  }

  async function srvPoll() {
    if (!srvUrl) return;
    try {
      const u = srvUrl + (srvUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      if (text !== srvLastText) { srvLastText = text; showRemote(); }
      srvEl.classList.remove('warn');
      srvEl.textContent = 'announcements: server, ' +
        new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      srvEl.title = srvUrl;
    } catch (e) {
      srvEl.classList.add('warn');
      srvEl.textContent = (srvLastText === null ? 'Cannot read ' : 'Lost contact with ')
        + 'the control file: ' + e.message;
      srvEl.title = srvUrl + ' — ' + e.message;
    }
  }

  function setServer(url) {
    url = (url || '').trim();
    if (url && !/^https?:\/\//i.test(url) && !/^[\w.-]+\.txt$/i.test(url)) url = '';   // ignore nonsense
    const was = srvUrl;
    srvUrl = url; store.set('srvUrl', srvUrl);
    if (srvTimer) { clearInterval(srvTimer); srvTimer = null; }
    if (srvUrl) {
      msg.setAttribute('contenteditable', 'false');
      msg.classList.add('remote');
      $('#clearBtn').disabled = true; undoBtn.disabled = true;
      srvLastText = null; srvShown = null;
      srvEl.textContent = 'announcements: connecting...';
      srvEl.classList.remove('warn');
      loadKatex(baseOf(srvUrl));
      srvPoll(); srvTimer = setInterval(srvPoll, 5000);
    } else {
      msg.setAttribute('contenteditable', 'true');
      msg.classList.remove('remote');
      $('#clearBtn').disabled = false;
      srvEl.textContent = ''; srvEl.title = '';
      msg.style.fontSize = fontSize + 'px';
      if (was) { msg.innerHTML = ''; msg.textContent = store.get('message', ''); lastSnapshot = msg.textContent; }
      undoBtn.disabled = history.length === 0;
    }
  }
  const _fup = $('#fontUp').onclick, _fdn = $('#fontDown').onclick;
  $('#fontUp').onclick = () => { _fup(); fitRemote(); };
  $('#fontDown').onclick = () => { _fdn(); fitRemote(); };
  window.addEventListener('resize', fitRemote);
  new ResizeObserver(fitRemote).observe(msg);

  urlIn.value = srvUrl;
  blockIn.value = srvBlock;
  urlIn.onchange = (e) => setServer(e.target.value);
  blockIn.onchange = (e) => { srvBlock = e.target.value; store.set('srvBlock', srvBlock); srvShown = null; showRemote(); };
  if (srvUrl) setServer(srvUrl);

  // ---------- clock ----------
  const clock = $('#clock'), ampm = $('#ampm'), dateEl = $('#date'), pane = $('#clockPane');
  const pad = (n) => String(n).padStart(2, '0');
  function tick() {
    const d = new Date();
    let h = d.getHours();
    if (!opts.h24) { ampm.textContent = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
    ampm.style.display = opts.h24 ? 'none' : '';
    let t = (opts.h24 ? pad(h) : h) + ':' + pad(d.getMinutes());
    if (opts.sec) t += ':' + pad(d.getSeconds());
    clock.textContent = t;
    dateEl.style.display = opts.date ? '' : 'none';
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  function fitClock() {
    const w = pane.clientWidth - 20, hgt = pane.clientHeight - 20;
    const chars = opts.sec ? 8 : 5;
    // reserve vertical room for the AM/PM line and the date line
    let share = 1;
    if (!opts.h24) share -= 0.22;
    if (opts.date) share -= 0.14;
    let size = Math.min(w / (chars * 0.60), hgt * share * 0.95);
    clock.style.fontSize = size + 'px';
    ampm.style.fontSize = (size * 0.22) + 'px';
    dateEl.style.fontSize = Math.max(14, size * 0.13) + 'px';
    for (let i = 0; i < 4 && clock.scrollWidth > w; i++) {
      size *= w / clock.scrollWidth * 0.98;
      clock.style.fontSize = size + 'px';
      ampm.style.fontSize = (size * 0.22) + 'px';
      dateEl.style.fontSize = Math.max(14, size * 0.13) + 'px';
    }
  }
  tick(); fitClock();
  setInterval(tick, 250);
  window.addEventListener('resize', fitClock);
  new ResizeObserver(fitClock).observe(pane);

  // ---------- draggable divider ----------
  const top = $('#top'), divider = $('#divider');
  top.style.height = store.get('topHeight', 32) + '%';
  let dragging = false;
  divider.addEventListener('mousedown', (e) => { dragging = true; e.preventDefault(); });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const pct = Math.max(12, Math.min(70, e.clientY / window.innerHeight * 100));
    top.style.height = pct + '%';
    fitClock();
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; store.set('topHeight', parseFloat(top.style.height)); }
  });
})();
</script>
</body>
</html>
